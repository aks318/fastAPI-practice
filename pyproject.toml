[project]
name = "fastapi-practice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aakash", email = "akashviahwakarma98@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "langchain>=1.5.2",
    "langchain-core>=1.8.4",
    "langchain-ollama>=1.2.0",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14.4",
    "sqlalchemy>=2.1.9",
    "uuid>=1.30",
    "uvicorn>=0.54.0",
]

[project.scripts]
fastapi-practice = "fastapi_practice:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
